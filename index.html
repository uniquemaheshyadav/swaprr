<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Swappr</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Handle Google Maps Auth/Billing Failure
    window.gm_authFailure_triggered = false;
    window.gm_authFailure = function () {
      console.error("Google Maps Authentication/Billing Failure");
      window.gm_authFailure_triggered = true;
      window.dispatchEvent(new Event('google-maps-error'));
    };

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            electric: {
              blue: '#3b82f6', // Bright Blue
              vivid: '#00d2ff', // Cyan accent
              dark: '#1d4ed8',
            },
            dark: {
              bg: '#0f0f11', // Almost black
              card: '#18181b', // Dark gray card
              text: '#f4f4f5',
            },
            light: {
              bg: '#ffffff',
              card: '#f4f4f5',
              text: '#09090b',
            }
          },
          boxShadow: {
            'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
            'neon': '0 0 10px rgba(59, 130, 246, 0.5)',
          },
          animation: {
            'shimmer': 'shimmer 2s linear infinite',
            'blob': 'blob 7s infinite',
          },
          keyframes: {
            shimmer: {
              from: { transform: 'translateX(-100%)' },
              to: { transform: 'translateX(100%)' },
            },
            blob: {
              "0%": { transform: "translate(0px, 0px) scale(1)" },
              "33%": { transform: "translate(30px, -50px) scale(1.1)" },
              "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
              "100%": { transform: "translate(0px, 0px) scale(1)" },
            },
          }
        },
      },
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    html,
    body,
    #root {
      height: 100%;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      /* Allow body to scroll naturally */
      overflow-x: hidden;
      overflow-y: auto;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
  <script src="https://maps.googleapis.com/maps/api/js?key=%VITE_GOOGLE_MAPS_API_KEY%&libraries=places"
    onerror="window.dispatchEvent(new Event('google-maps-error'))">
    </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "openai": "https://esm.sh/openai@4.28.0",
    "lucide-react": "https://esm.sh/lucide-react@0.344.0?external=react",
    "framer-motion": "https://esm.sh/framer-motion@11.0.8?external=react,react-dom"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
